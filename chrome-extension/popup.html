<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Tiệm Nhà Nhỏ — Shopee Bridge</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; padding: 14px; width: 320px; background: #fffbf7; color: #1c1917; }
    .hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .hdr img { width: 34px; height: 34px; border-radius: 8px; }
    .hdr h1 { margin: 0; font-size: 14px; font-weight: 700; color: #ea580c; }
    .hdr p { margin: 2px 0 0; font-size: 11px; color: #78716c; }
    .card { background: #ffffff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 12px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .ok { background: #dcfce7; color: #166534; }
    .warn { background: #fef3c7; color: #92400e; }
    .btn { display: block; width: 100%; border: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 6px; text-align: center; }
    .btn-primary { background: linear-gradient(90deg, #f97316, #dc2626); color: #fff; }
    .btn-secondary { background: #f5f5f4; color: #1c1917; border: 1px solid #d6d3d1; }
    ol { margin: 6px 0 0; padding-left: 16px; color: #57534e; line-height: 1.5; font-size: 11px; }
  </style>
</head>
<body>
  <div class="hdr">
    <img src="icons/icon48.png" alt="Logo" />
    <div>
      <h1>Shopee Bridge v1.0</h1>
      <p>Tiệm Nhà Nhỏ · IP nhà &amp; Cookie thật</p>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>Trạng thái Shopee.vn</strong>
      <span id="shopee-status" class="badge warn">Đang kiểm tra...</span>
    </div>
    <p id="shopee-note" style="margin:6px 0 0; font-size:11px; color:#57534e;"></p>
    <button id="open-shopee" class="btn btn-secondary">Mở Shopee.vn để đăng nhập</button>
  </div>

  <div class="card">
    <strong>Cách sử dụng nhanh</strong>
    <ol>
      <li>Đăng nhập sẵn tài khoản trên <b>shopee.vn</b>.</li>
      <li>Mở trang Admin <b>Tiệm Nhà Nhỏ</b> &rarr; tab Cào Shopee.</li>
      <li>Bấm <b>"Cào qua Chrome Extension"</b> để đồng bộ sản phẩm thật về kho.</li>
    </ol>
    <button id="open-admin-prod" class="btn btn-primary">Mở Admin (n-ttnt.vercel.app)</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
